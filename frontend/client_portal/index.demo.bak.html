<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techtanium - 客户端管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0b1120;
            --bg-sidebar: #111827;
            --bg-card: #1e293b;
            --bg-card-hover: #253449;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-purple: #a855f7;
            --border-color: #334155;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .logo {
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo span { color: var(--accent-blue); }

        .nav-menu {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 2px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-size: 14px;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: var(--accent-blue);
            border-radius: 0 3px 3px 0;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nav-arrow {
            margin-left: auto;
            opacity: 0.5;
            font-size: 12px;
            transition: transform 0.2s;
        }

        .nav-item:hover .nav-arrow { opacity: 1; }

        .user-avatar-bottom {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            height: 64px;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-date {
            font-size: 13px;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .header-user:hover { background: rgba(255,255,255,0.05); }

        .header-user .avatar-circle {
            width: 28px;
            height: 28px;
            font-size: 12px;
            background: var(--accent-blue);
        }

        .header-user span {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Page Content */
        .page-content {
            padding: 24px 32px;
            flex: 1;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .page-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Cards Grid */
        .cards-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .cards-row-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .stat-card-left {
            flex: 1;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1;
        }

        .stat-sub {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-icon.cyan { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
        .stat-icon.yellow { background: rgba(234, 179, 8, 0.15); color: var(--accent-yellow); }
        .stat-icon.green { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
        .stat-icon.red { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .stat-icon.purple { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); }
        .stat-icon.blue { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }

        /* Chart Section */
        .chart-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .chart-title-icon {
            color: var(--accent-blue);
        }

        .chart-controls {
            display: flex;
            gap: 8px;
        }

        .chart-btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .chart-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .chart-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .chart-canvas-wrap {
            position: relative;
            height: 280px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Responsive */
        @media (max-width: 1200px) {
            .cards-row { grid-template-columns: repeat(2, 1fr); }
            .cards-row-3 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .cards-row { grid-template-columns: 1fr; }
            .cards-row-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>

                            <button class="chart-btn active" data-range="7d" onclick="switchRange('7d', this)">7日</button>
                            <button class="chart-btn" data-range="1m" onclick="switchRange('1m', this)">1月</button>
                            <button class="chart-btn" data-range="3m" onclick="switchRange('3m', this)">3月</button>
                            <button class="chart-btn" data-range="6m" onclick="switchRange('6m', this)">6月</button>
                        </div>
                    </div>
                    <div class="chart-canvas-wrap">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Navigation active state
        function setActive(el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
        }

        // Update date
        const now = new Date();
        const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日${weekdays[now.getDay()]}`;
        document.getElementById('current-date').textContent = dateStr;

        // Chart setup
        const ctx = document.getElementById('trendChart').getContext('2d');
        let currentChartType = 'area';
        let currentRange = '7d';
        let chartInstance = null;

        const rangeData = {
            '7d': {
                labels: ['07-04', '07-05', '07-06', '07-07', '07-08', '07-09', '07-10'],
                data: [12500, 18200, 15600, 24300, 19800, 22100, 15700]
            },
            '1m': {
                labels: ['第1周', '第2周', '第3周', '第4周'],
                data: [85600, 102400, 78900, 94500]
            },
            '3m': {
                labels: ['5月', '6月', '7月'],
                data: [320000, 365000, 280000]
            },
            '6m': {
                labels: ['2月', '3月', '4月', '5月', '6月', '7月'],
                data: [210000, 280000, 320000, 350000, 365000, 280000]
            }
        };

        function createGradient(ctx) {
            const gradient = ctx.createLinearGradient(0, 0, 0, 280);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');
            return gradient;
        }

        function initChart() {
            if (chartInstance) chartInstance.destroy();
            const data = rangeData[currentRange];
            const isArea = currentChartType === 'area';

            chartInstance = new Chart(ctx, {
                type: isArea ? 'line' : 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: '汇款金额 (USD)',
                        data: data.data,
                        borderColor: '#3b82f6',
                        backgroundColor: isArea ? createGradient(ctx) : 'rgba(59, 130, 246, 0.6)',
                        borderWidth: 2,
                        fill: isArea,
                        tension: 0.4,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#1e293b',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        borderRadius: isArea ? 0 : 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            borderColor: '#334155',
                            borderWidth: 1,
                            titleColor: '#fff',
                            bodyColor: '#94a3b8',
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return '$' + context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.3)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { size: 12 }
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.3)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { size: 12 },
                                callback: function(value) {
                                    if (value >= 1000) return (value/1000).toFixed(0) + 'k';
                                    return value;
                                }
                            }
                        }
                    }
                }
            });
        }

        function switchChartType(type, btn) {
            currentChartType = type;
            document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initChart();
        }

        function switchRange(range, btn) {
            currentRange = range;
            document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initChart();
        }

        // Initialize
        initChart();
    </script>
</body>
</html>
