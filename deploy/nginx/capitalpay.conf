# CapitalPay — Nginx site (HTTP on standard port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:1024;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:1024;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/capitalpay/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /opt/capitalpay/media/;
        expires 1d;
    }

    # Customer portal SPA at /customer/
    location /customer/ {
        root /var/www/capitalpay;
        try_files $uri $uri/ /customer/index.html;
    }

    # Ops portal SPA at /
    location / {
        root /var/www/capitalpay/client;
        try_files $uri $uri/ /index.html;
    }
}
